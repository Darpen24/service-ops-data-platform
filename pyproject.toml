[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "service-ops-data-platform"
version = "0.1.0"
description = "Foundation for a local-first service operations data platform."
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { file = "LICENSE" }
authors = [{ name = "Service Operations Data Platform contributors" }]
dependencies = [
  "pandas>=2.2,<3",
  "pyarrow>=16,<20",
  "psycopg[binary]>=3.2,<4",
  "python-dotenv>=1.0,<2",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.11,<2",
  "pytest>=8.3,<9",
  "pytest-cov>=5,<7",
  "ruff>=0.6,<1",
  "sqlfluff>=3.1,<4",
]
dbt = [
  "dbt-postgres>=1.8,<2",
]

[tool.hatch.build.targets.wheel]
packages = ["src/service_ops"]

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra --strict-markers"
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["service_ops"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
mypy_path = "src"
packages = ["service_ops"]
strict = true
warn_unreachable = true
